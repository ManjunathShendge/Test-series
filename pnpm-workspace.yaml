packages:
  - "apps/*"
  - "packages/*"

# Dependencies require no install scripts.
allowBuilds: { '@prisma/engines': set this to true or false, prisma: set this to true or false }

# Shared dependency versions, resolved against the npm registry in M0 on 13 November 2026.
# This is the single place a shared version is declared, so apps and packages cannot drift.
# Reference from a package.json as "catalog:".
#
# typescript: held on the 5.x line deliberately. TypeScript 7.0.2 is stable and much faster,
# and Next.js 16 works with it, but 7.0 ships no programmatic compiler API, which `nest build`
# depends on. The API is expected to return in 7.1 (7.1.0-beta exists). Re-evaluate then, and
# move the whole workspace together rather than splitting the version across packages.
catalog:
  typescript: 5.9.3
  zod: 4.6.7
  "@types/node": 22.20.5
  prettier: 3.10.1
  vitest: 5.1.0

minimumReleaseAgeExclude:
  - prettier@3.10.1
  - '@nestjs/common@12.5.0'
  - '@nestjs/core@12.5.0'
  - '@nestjs/platform-express@12.5.0'
  - expo@58.0.25
