name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the secret scan
      - name: Secret scan (gitleaks, whole history)
        # Pinned release verified by checksum; reviewed false positives live in .gitleaksignore.
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --no-banner
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup
      - run: pnpm check:public-env
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm services:up
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm db:seed
      - run: pnpm test:int
      - run: pnpm test:e2e
      - name: Build server images
        run: |
          docker build -f apps/api/Dockerfile -t exam-prep-api:ci .
          docker build -f apps/web/Dockerfile -t exam-prep-web:ci .
