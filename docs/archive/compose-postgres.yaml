name: exam-prep-local
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: exam_migrator
      POSTGRES_PASSWORD: local_migration_only
      POSTGRES_DB: exam_prep
    ports: ['127.0.0.1:${POSTGRES_PORT:-15432}:5432']
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U exam_migrator -d exam_prep']
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    build: ./docker/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: local_minio
      MINIO_ROOT_PASSWORD: local_minio_password
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: ['minio-data:/data']
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 3s
      retries: 30
  minio-init:
    profiles: [tools]
    build: ./docker/minio
    entrypoint: ['/bin/sh', '/init-buckets.sh']
    depends_on:
      minio:
        condition: service_healthy
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
    volumes: ['mailpit-data:/data']
    environment:
      MP_DATABASE: /data/mailpit.db
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 3s
      retries: 20
  firebase:
    build: ./docker/firebase
    ports: ['127.0.0.1:9099:9099', '127.0.0.1:4000:4000']
    volumes: ['firebase-data:/data']
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:9099/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
  minio-data:
  mailpit-data:
  firebase-data:
